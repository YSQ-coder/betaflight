# OpenOCD config for WCHLink (CMSIS-DAP) + STM32F722 flight controller
# Usage:
#   sudo ./tools/openocd/bin/openocd -s tools/openocd/share/openocd/scripts -f debug/openocd_f722.cfg
#
# GDB connect:
#   arm-none-eabi-gdb -x debug/gdbinit_f722

source [find interface/cmsis-dap.cfg]
transport select swd

# WCHLink DAP adapter speed (kHz) - F722 supports up to 8MHz SWD
adapter speed 4000

source [find target/stm32f7x.cfg]

# Keep reset config compatible with flight controllers (no SRST line typically)
reset_config none separate

# Useful for live debugging - don't reset on connect
$_TARGETNAME configure -event gdb-attach {
    halt
}
